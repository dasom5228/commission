<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>커미션 안내</title>

  <style>
    body {
      margin: 0;
      background-color: #666666;
      color: #333333;
      line-height: 1.6;
      padding: 40px 20px;
    }
    #page {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
    }

    #notice-section {
      width: 100%;
    }

    #notice-title {
      display: inline-block;

      margin: 0 0 10px 0;

      font-size: 24px;
      font-weight: 900;

      color: #000000;

      cursor: default;

      transition: transform 0.2s ease;
    }
    #notice-title:hover {
      transform: scale(1.05);
    }
    #notice-box {
      width: 100%;
      box-sizing: border-box;

      background-color: #eeeeee;

      padding: 15px 18px;

      font-size: 15px;
      color: #333333;

      line-height: 1.6;

      overflow-wrap: break-word;
    }
  </style>
</head>

<body>

  <main id="page">

    <section id="notice-section">

      <h2 id="notice-title">공지사항</h2>

      <div id="notice-box">
        여기에 공지사항 내용을 입력해주세요.<br>
        글이 길어지면 회백색 박스도 그만큼 아래로 늘어납니다.
      </div>

    </section>

  </main>

</body>
</html>
