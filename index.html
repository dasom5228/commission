<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>커미션 안내</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      background-color: #F7F7F7;
      padding: 20px;
    }

    #main-all {
      position: relative;
      width: 100%;
      min-height: calc(100vh - 20px);
      background-color: #FFFFFF;
      border: 3px solid #C93463;
      border-radius: 20px;
      box-shadow:
        0 0 0 1px rgba(255, 225, 234, 0.95),
        0 0 3px 2px rgba(255, 225, 234, 0.85),
        0 0 6px 4px rgba(255, 225, 234, 0.55),
        0 0 9px 5px rgba(255, 225, 234, 0.25);
    }
  </style>
</head>

<body>

  <main id="main-all">

  </main>

</body>
</html>
